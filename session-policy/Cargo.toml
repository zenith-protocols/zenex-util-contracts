[package]
name = "session-policy"
version = "0.0.0"
authors = ["Zenith Protocols"]
license = "AGPL-3.0"
edition = "2021"
publish = false

[lib]
crate-type = ["lib", "cdylib"]
doctest = false

[features]
testutils = ["soroban-sdk/testutils"]

[dependencies]
soroban-sdk = { workspace = true }
stellar-accounts = { workspace = true }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }
# The regression suite in tests/ signs as a real session key.
ed25519-dalek = "2"
